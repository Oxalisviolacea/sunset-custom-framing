name: Daily pickup sync and digest

on:
  schedule:
    # 10:00 America/New_York year-round. GitHub cron is UTC only, so both
    # candidate hours fire -- 14:23 UTC is 10am EDT, 15:23 UTC is 10am EST --
    # and the gate below drops whichever is wrong for the current offset.
    # :23 rather than :00 because the top of the hour is the most contended
    # minute on the platform.
    - cron: "23 14 * * *"
    - cron: "23 15 * * *"
    # TEMPORARY: proves the scheduler works now the repo is public. Remove.
    - cron: "5 17 * * *"
    - cron: "12 17 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  sync-and-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Decide on the UTC offset, not the local hour. GitHub often runs
      # scheduled jobs late, and an hour-equality test would reject a delayed
      # run and its DST twin both, so a late trigger would mean no run at all.
      # The offset does not shift when the run is late.
      - name: Right slot for the current offset?
        id: gate
        run: |
          offset=$(TZ=America/New_York date +%z)
          sched="${{ github.event.schedule }}"
          local_time=$(TZ=America/New_York date '+%H:%M')
          if [ "${{ github.event_name }}" != "schedule" ]; then
            ok=true
          elif [ "$sched" = "5 17 * * *" ] || [ "$sched" = "12 17 * * *" ]; then
            ok=true                                   # TEMPORARY test slots
          elif [ "$sched" = "23 14 * * *" ] && [ "$offset" = "-0400" ]; then
            ok=true
          elif [ "$sched" = "23 15 * * *" ] && [ "$offset" = "-0500" ]; then
            ok=true
          else
            ok=false
          fi
          echo "run=$ok" >> "$GITHUB_OUTPUT"
          echo "schedule='${sched}' offset=${offset} local=${local_time} -> run=${ok}"

      # Guards against the same day being processed twice -- an Apps Script
      # retry, or someone dispatching by hand after the morning run. Nobody
      # should get two digests.
      - name: Has a run already succeeded today?
        id: dedupe
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          today=$(TZ=America/New_York date +%Y-%m-%d)
          count=$(gh run list --repo "${{ github.repository }}" \
                    --workflow daily.yml --status success --limit 30 \
                    --json createdAt --jq "[.[] | select(.createdAt >= \"${today}\")] | length" \
                  || echo 0)
          if [ "${count:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already succeeded ${count} time(s) today; skipping so nobody gets a second email."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Nothing has succeeded yet today; proceeding."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true' && steps.dedupe.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true' && steps.dedupe.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.gate.outputs.run == 'true' && steps.dedupe.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Restore Google credentials
        if: steps.gate.outputs.run == 'true' && steps.dedupe.outputs.skip != 'true'
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          printf '%s' "$GOOGLE_TOKEN_JSON" > token.json
          chmod 600 credentials.json token.json

      - name: Sync pickups, then send the digest
        if: steps.gate.outputs.run == 'true' && steps.dedupe.outputs.skip != 'true'
        env:
          VF_USERNAME: ${{ secrets.VF_USERNAME }}
          VF_PASSWORD: ${{ secrets.VF_PASSWORD }}
          VF_CALENDAR_ID: ${{ secrets.VF_CALENDAR_ID }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: ./run_daily.sh

      # Tells an outside service the run happened. If that ping stops arriving,
      # the service emails you -- which is the only way to learn that GitHub
      # never ran the job at all, since nothing here would be running to notice.
      # Optional: skipped entirely when the secret is not set.
      - name: Ping the dead-man's switch
        if: steps.gate.outputs.run == 'true' && steps.dedupe.outputs.skip != 'true' && success()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then
            curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL" >/dev/null && echo "pinged"
          else
            echo "No HEALTHCHECK_URL secret set; skipping."
          fi

      # Keeps the machine-readable result even when the run failed, which is
      # when you most want to look at it.
      - name: Upload run report
        if: always() && steps.gate.outputs.run == 'true' && steps.dedupe.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: last-run-report
          path: last_run_report.json
          if-no-files-found: warn
          retention-days: 30
