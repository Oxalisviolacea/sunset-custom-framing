name: Daily pickup sync and digest

on:
  # No schedule. GitHub's cron did eventually start firing for this repo, but
  # roughly four hours late -- a 14:23 slot ran at 18:08. That is no use for a
  # morning digest and it is not worth keeping a second scheduler around to
  # explain. Apps Script starts this, by dispatch: trigger/AppsScriptTrigger.gs
  workflow_dispatch:

jobs:
  sync-and-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Decide on the UTC offset, not the local hour. GitHub often runs
      # scheduled jobs late, and an hour-equality test would reject a delayed
      # run and its DST twin both, so a late trigger would mean no run at all.
      # The offset does not shift when the run is late.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore Google credentials
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          printf '%s' "$GOOGLE_TOKEN_JSON" > token.json
          chmod 600 credentials.json token.json

      - name: Sync pickups, then send the digest
        env:
          VF_USERNAME: ${{ secrets.VF_USERNAME }}
          VF_PASSWORD: ${{ secrets.VF_PASSWORD }}
          VF_CALENDAR_ID: ${{ secrets.VF_CALENDAR_ID }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: ./run_daily.sh

      # Tells an outside service the run happened. If that ping stops arriving,
      # the service emails you -- which is the only way to learn that GitHub
      # never ran the job at all, since nothing here would be running to notice.
      # Optional: skipped entirely when the secret is not set.
      - name: Ping the dead-man's switch
        if: success()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then
            curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL" >/dev/null && echo "pinged"
          else
            echo "No HEALTHCHECK_URL secret set; skipping."
          fi

      # Keeps the machine-readable result even when the run failed, which is
      # when you most want to look at it.
      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-run-report
          path: last_run_report.json
          if-no-files-found: warn
          retention-days: 30
