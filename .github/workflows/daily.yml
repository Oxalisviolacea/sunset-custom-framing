name: Daily pickup sync and digest

on:
  schedule:
    # Target is 10:00 America/New_York year-round. GitHub cron is UTC only and
    # has no timezone support, so a single hour would drift to 11am across DST.
    # Fire at both candidate hours -- 14:00 UTC is 10am EDT, 15:00 UTC is 10am
    # EST -- and let the gate step below drop whichever one is the wrong hour
    # locally. Exactly one runs on any given day.
    - cron: "25 3 * * *"   # TEMPORARY test fire — reverted right after
  workflow_dispatch:      # lets you run it by hand from the Actions tab

jobs:
  sync-and-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Only proceed at 10am Eastern
        id: gate
        run: |
          hour=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$hour" = "23" ]; then   # TEMPORARY: 23 for the test
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Proceeding (local hour ${hour}, event ${{ github.event_name }})."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Local hour is ${hour}, not 10. This is the DST twin; skipping."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Restore Google credentials
        if: steps.gate.outputs.run == 'true'
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          printf '%s' "$GOOGLE_TOKEN_JSON" > token.json
          chmod 600 credentials.json token.json

      - name: Sync pickups, then send the digest
        if: steps.gate.outputs.run == 'true'
        env:
          VF_USERNAME: ${{ secrets.VF_USERNAME }}
          VF_PASSWORD: ${{ secrets.VF_PASSWORD }}
          VF_CALENDAR_ID: ${{ secrets.VF_CALENDAR_ID }}
        run: ./run_daily.sh

      # Keeps the machine-readable result even when the run failed, which is
      # when you most want to look at it.
      - name: Upload run report
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: last-run-report
          path: last_run_report.json
          if-no-files-found: warn
          retention-days: 30
