name: Daily pickup sync and digest

on:
  schedule:
    # Target is 10:00 America/New_York year-round. GitHub cron is UTC only, so
    # fire at both candidate hours -- 14:00 UTC is 10am EDT, 15:00 UTC is 10am
    # EST -- and let the gate below drop the one that is wrong for the current
    # offset. Exactly one runs per day.
    #
    # :07 rather than :00 on purpose. GitHub queues scheduled jobs best-effort
    # and the top of the hour is the most contended minute on the platform;
    # runs there are routinely delayed and sometimes dropped.
    - cron: "7 14 * * *"
    - cron: "7 15 * * *"
    # TEMPORARY test slots -- remove after today
    - cron: "45 14 * * *"
    - cron: "50 14 * * *"
    - cron: "55 14 * * *"
  workflow_dispatch:      # lets you run it by hand from the Actions tab

jobs:
  sync-and-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Only proceed at 10am Eastern
        id: gate
        run: |
          # Decide on the UTC offset, not the local hour. GitHub frequently runs
          # scheduled jobs late; an hour-equality check would reject a delayed
          # run AND its DST twin, so a late trigger would mean no run that day.
          # The offset does not change with the delay, so this still fires.
          offset=$(TZ=America/New_York date +%z)   # -0400 in EDT, -0500 in EST
          sched="${{ github.event.schedule }}"
          local_time=$(TZ=America/New_York date '+%H:%M')

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run, proceeding (local time ${local_time})."
          elif [ "$sched" = "7 14 * * *" ] && [ "$offset" = "-0400" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "EDT slot, proceeding (local time ${local_time}, offset ${offset})."
          elif [ "$sched" = "45 14 * * *" ] || [ "$sched" = "50 14 * * *" ] || [ "$sched" = "55 14 * * *" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "TEMPORARY test slot '${sched}', proceeding (local ${local_time})."
          elif [ "$sched" = "7 15 * * *" ] && [ "$offset" = "-0500" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "EST slot, proceeding (local time ${local_time}, offset ${offset})."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Schedule '${sched}' is the wrong slot for offset ${offset}; skipping."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Restore Google credentials
        if: steps.gate.outputs.run == 'true'
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          printf '%s' "$GOOGLE_TOKEN_JSON" > token.json
          chmod 600 credentials.json token.json

      - name: Sync pickups, then send the digest
        if: steps.gate.outputs.run == 'true'
        env:
          VF_USERNAME: ${{ secrets.VF_USERNAME }}
          VF_PASSWORD: ${{ secrets.VF_PASSWORD }}
          VF_CALENDAR_ID: ${{ secrets.VF_CALENDAR_ID }}
        run: ./run_daily.sh

      # Tells an outside service the run happened. If that ping stops arriving,
      # the service emails you -- which is the only way to learn that GitHub
      # never ran the job at all, since nothing here would be running to notice.
      # Optional: skipped entirely when the secret is not set.
      - name: Ping the dead-man's switch
        if: steps.gate.outputs.run == 'true' && success()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then
            curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL" >/dev/null && echo "pinged"
          else
            echo "No HEALTHCHECK_URL secret set; skipping."
          fi

      # Keeps the machine-readable result even when the run failed, which is
      # when you most want to look at it.
      - name: Upload run report
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: last-run-report
          path: last_run_report.json
          if-no-files-found: warn
          retention-days: 30
