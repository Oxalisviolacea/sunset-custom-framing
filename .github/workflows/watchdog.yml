name: Watchdog — did the daily run happen?

# The digest can only report a failure if the script ran. When GitHub drops the
# scheduled job nothing runs, nothing is caught, and nothing is sent: silence
# looks exactly like success. This checks later in the day and shouts if the
# sync never happened.
#
# It is still a GitHub schedule, so it cannot detect GitHub being wholly down.
# The dead-man's switch in daily.yml covers that.

on:
  schedule:
    - cron: "7 17 * * *"   # 1:07pm EDT
    - cron: "7 18 * * *"   # 1:07pm EST
    # TEMPORARY test slots -- remove after today
    - cron: "5 15 * * *"
    - cron: "10 15 * * *"
  workflow_dispatch:

permissions:
  actions: read          # needed to ask whether the daily workflow succeeded
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Right slot for the current offset?
        id: gate
        run: |
          offset=$(TZ=America/New_York date +%z)
          sched="${{ github.event.schedule }}"
          case "$sched" in
            "5 15 * * *"|"10 15 * * *") ok=yes ;;                       # test slots
            "7 17 * * *") [ "$offset" = "-0400" ] && ok=yes || ok=no ;;
            "7 18 * * *") [ "$offset" = "-0500" ] && ok=yes || ok=no ;;
            *) ok=yes ;;                                                # manual
          esac
          if [ "${{ github.event_name }}" != "schedule" ]; then ok=yes; fi
          echo "run=$ok" >> "$GITHUB_OUTPUT"
          echo "schedule='${sched}' offset=${offset} -> run=${ok}"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'yes'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'yes'
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.gate.outputs.run == 'yes'
        run: pip install -r requirements.txt

      - name: Restore Google credentials
        if: steps.gate.outputs.run == 'yes'
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          printf '%s' "$GOOGLE_TOKEN_JSON" > token.json
          chmod 600 credentials.json token.json

      - name: Check, and email if the sync never ran
        if: steps.gate.outputs.run == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VF_CALENDAR_ID: ${{ secrets.VF_CALENDAR_ID }}
        run: python watchdog.py --send
